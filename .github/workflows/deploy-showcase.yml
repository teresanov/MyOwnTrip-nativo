name: Deploy DS Showcase

on:
  push:
    branches: [main]
    paths:
      - "ds-showcase/**"
      - "live-demos/**"
      - "designsystem/src/**"
      - ".github/workflows/deploy-showcase.yml"
  pull_request:
    paths:
      - "ds-showcase/**"
      - "live-demos/**"
      - "designsystem/src/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-showcase
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Demos vivas: los componentes Compose reales compilados a WebAssembly (live-demos/).
      - name: Build live demos (Compose → Wasm)
        run: ./gradlew -p live-demos wasmJsBrowserDistribution --console=plain
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ds-showcase/package-lock.json
      - name: Install and build
        working-directory: ds-showcase
        run: |
          npm ci
          npm run live
          npm run build
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ds-showcase/dist
          commit_message: "Deploy DS showcase"
