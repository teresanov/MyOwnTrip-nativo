name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "designsystem/**"
      - "catalog/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "designsystem/**"
      - "catalog/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, app and catalog debug builds
        run: ./gradlew testDebugUnitTest :app:assembleDebug :catalog:assembleDebug --console=plain
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
